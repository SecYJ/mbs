packages:
    - client
    - server
    - packages/*

minimumReleaseAge: 10080
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
catalog:
    vite: ^8.1.5
    vitest: ^4.1.10
overrides:
    vitest: "catalog:"
peerDependencyRules:
    allowAny:
        - vite
        - vitest
    allowedVersions:
        vite: "*"
        vitest: "*"
allowBuilds:
    esbuild: true
    msgpackr-extract: true
    simple-git-hooks: true
