minimumReleaseAge: 10080
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
catalog:
    vite: npm:@voidzero-dev/vite-plus-core@^0.1.22
    vite-plus: ^0.1.22
    vitest: npm:@voidzero-dev/vite-plus-test@^0.1.22
overrides:
    vite: "catalog:"
    vitest: "catalog:"
peerDependencyRules:
    allowAny:
        - vite
        - vitest
    allowedVersions:
        vite: "*"
        vitest: "*"
allowBuilds:
    esbuild: true
    msgpackr-extract: true
