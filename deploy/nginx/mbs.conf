# Public entry point. Only the client SSR server is reachable from the internet;
# Express (127.0.0.1:3000) is called by the SSR server's BFF and is never proxied here.
# certbot adds the TLS certificate lines and the HTTP -> HTTPS redirect.

# Log the path without the query string: the password reset link carries its token in `?token=`.
log_format mbs_no_query '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent"';

upstream mbs_client {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name mbs.example.com;

    client_max_body_size 1m;
    access_log /var/log/nginx/mbs.access.log mbs_no_query;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Vite fingerprints every file under /assets/, so nginx serves them directly and caches them forever
    # (the Node server would otherwise re-compress each file on every request).
    location /assets/ {
        alias /srv/mbs/client/dist/client/assets/;
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://mbs_client;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite (not append) so a client cannot spoof its IP; Express rate limits on this.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
